name: PM e-Vidya Android TWA Bundle Build

on:
  push:
    branches:
      - feature/android-twa-pwa
      - staging
      - main
    paths:
      - 'android/**'
      - 'public/manifest.json'
      - 'public/.well-known/**'
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Signed Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Decode Keystore from GitHub Secret
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/pmevidya-release.keystore
            echo "Release keystore securely restored from GitHub Secret."
          elif [ -f "android/pmevidya-release.keystore" ]; then
            echo "Using existing workspace keystore."
          else
            echo "::warning::No keystore found. Build will require ANDROID_KEYSTORE_BASE64 secret."
          fi

      - name: Build Signed Release App Bundle (AAB)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'pmevidya' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Copy AAB to Release Artifact Location
        run: |
          mkdir -p android/build-outputs
          cp android/app/build/outputs/bundle/release/app-release.aab android/build-outputs/in.nimi.pmevidya-v1.0.0-release.aab || cp android/app/build/outputs/bundle/release/*.aab android/build-outputs/in.nimi.pmevidya-v1.0.0-release.aab

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: in.nimi.pmevidya-release-aab
          path: android/build-outputs/in.nimi.pmevidya-v1.0.0-release.aab
          retention-days: 30
